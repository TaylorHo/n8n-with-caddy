services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "3"
    mem_limit: 30m
    mem_reservation: 20m
    memswap_limit: 40m
    oom_score_adj: -200

  n8n:
    image: n8nio/n8n:2.30.5
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "3"
    mem_limit: 580m
    mem_reservation: 440m
    memswap_limit: 740m
    oom_score_adj: 100

# Create the volumes with `docker volume create <volume_name>`
volumes:
  caddy_data:
    external: true
  caddy_config:
    external: true
  n8n_data:
    external: true
